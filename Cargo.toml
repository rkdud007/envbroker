[package]
name = "envbroker"
version = "0.1.0"
edition = "2024"
license = "MIT"
exclude = ["docs"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.0.6"
serde_json = "1"
dirs = "6"
age = { version = "0.11.2", features = ["armor"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
